<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videoclipuri produse – Depozit haine second hand</title>
<style>
:root{--gold:#d8a84f;--ink:#171717;--red:#c7221b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f5f0;color:#222}
main{max-width:1160px;margin:auto;padding:22px 18px 50px}
header{background:linear-gradient(115deg,#111,#3b2a11);color:white;padding:34px 28px;border-radius:20px}
h1{margin:0;font-size:clamp(26px,4vw,42px)}header p{color:#ead19d;margin-bottom:0}
nav{margin:22px 0;display:flex;gap:12px;flex-wrap:wrap}nav a{background:#161616;color:#e7ba65;padding:12px 17px;border-radius:10px;text-decoration:none;font-weight:bold}
.search{width:100%;padding:15px 16px;border:1px solid #d6d0c4;border-radius:12px;font-size:16px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:white;border:1px solid #e6e0d5;border-radius:16px;padding:20px;box-shadow:0 4px 16px #0000000a;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:20px;margin:0}.card p{margin:0;color:#555;line-height:1.5;flex:1}
.watch{display:inline-block;text-align:center;background:var(--red);color:white;text-decoration:none;border-radius:9px;padding:13px 14px;font-weight:800}
.watch:hover{background:#991812}.notice{padding:15px;background:#fff3d9;border-radius:10px}
footer{margin-top:35px;text-align:center;color:#666;font-size:14px}
</style></head><body><main>
<header><h1>🎬 Videoclipuri produse</h1><p>Descoperă articolele disponibile prin videoclipuri reale. Actualizare automată din lista de prețuri.</p></header>
<nav><a href="/">← Lista de prețuri</a><a href="https://depozit-hainesecond.ro/">Site principal</a></nav>
<input id="search" class="search" type="search" placeholder="🔎 Caută un produs..." aria-label="Caută un produs">
<p id="status" class="notice">Se încarcă videoclipurile...</p><div id="grid" class="grid"></div>
<footer>UNIQUE TEXTIL · Videoclipurile se deschid pe YouTube.</footer>
</main><script>
const CSV_URL="prices.csv";
const grid=document.getElementById("grid"),status=document.getElementById("status"),search=document.getElementById("search");
let products=[];
function norm(s){return String(s??"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ")}
function field(r,keys){for(const k of keys){if(r[norm(k)]!==undefined)return String(r[norm(k)]??"").trim()}return ""}
function parseCSV(s){let rows=[],row=[],cell="",quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===","&&!quoted){row.push(cell);cell=""}else if((c==="\r"||c==="\n")&&!quoted){if(c==="\r"&&s[i+1]==="\n")i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=""}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function ytId(raw){try{const u=new URL(raw);if(u.protocol!=="https:")return "";const host=u.hostname.toLowerCase(),p=u.pathname.split("/").filter(Boolean);let id="";if(["youtu.be","www.youtu.be"].includes(host))id=p[0]||"";else if(["youtube.com","www.youtube.com","m.youtube.com"].includes(host)){if(p[0]==="watch")id=u.searchParams.get("v")||"";else if(["shorts","embed","live"].includes(p[0]))id=p[1]||""}return /^[\w-]{11}$/.test(id)?id:""}catch{return ""}}
function active(v){const s=norm(v);return !s||["da","yes","igen","true","1","aktiv","active","x"].includes(s)}
function render(){const q=norm(search.value);const filtered=products.filter(x=>norm(x.name+" "+x.desc).includes(q));grid.replaceChildren();for(const p of filtered){const card=document.createElement("article");card.className="card";const title=document.createElement("h2");title.textContent=p.name;const desc=document.createElement("p");desc.textContent=p.desc;const a=document.createElement("a");a.className="watch";a.href="https://www.youtube.com/watch?v="+p.id;a.target="_blank";a.rel="noopener noreferrer";a.textContent="▶ VEZI VIDEO PE YOUTUBE";card.append(title,desc,a);grid.append(card)}status.textContent=filtered.length?`${filtered.length} produse cu videoclip`:"Nu am găsit produse cu videoclip.";status.hidden=false}
async function load(){try{const res=await fetch(CSV_URL+"?v="+Date.now());if(!res.ok)throw Error("HTTP "+res.status);const rows=parseCSV(await res.text());if(rows.length<2)throw Error("CSV gol");const headers=rows[0].map(norm);products=rows.slice(1).map(c=>Object.fromEntries(headers.map((h,i)=>[h,(c[i]||"").trim()]))).filter(r=>active(field(r,["aktiv","active"]))).map(r=>({name:field(r,["ro produs","ro produsul","ro termék","ro termek","produs","denumire","ro denumire"]),desc:field(r,["ro descriere","ro leírás","ro leiras","descriere","descriere produs"]),id:ytId(field(r,["video","videó","youtube","video url"]))})).filter(x=>x.id&&x.name);render()}catch(e){status.textContent="Nu s-au putut încărca videoclipurile. Verifică fișierul prices.csv și coloanele RO / VIDEO.";console.error(e)}}
search.addEventListener("input",render);load();
</script></body></html>
