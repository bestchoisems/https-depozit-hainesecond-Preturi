
name: Update prices CSV

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-prices-csv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download Google Sheets CSV
        run: |
          curl --fail --location --retry 3 \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5bjWev7GFUm1nt7yxveY8iozWNzRu4-kYX1bi4dsMLmoDjlxXAon8amxoYpaREQylNFu2Eh4Q_IYU/pub?gid=0&single=true&output=csv" \
            -o prices.csv

          test -s prices.csv

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          cp prices.csv /tmp/prices.csv

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/prices.csv prices.csv
          git add prices.csv

          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi

          git commit -m "Update prices CSV"
          git push origin main
